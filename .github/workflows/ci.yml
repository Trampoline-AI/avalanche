name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
      - run: uv sync --all-extras
      - run: uv run ruff check src/ test/
      - run: uv run pytest -m "not tmux and not ray"
        env:
          PYTHONFAULTHANDLER: "1"

  web:
    name: Browser UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - run: uv sync --all-extras
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make web-proto
      - run: make web-test
      - run: make web-assets-check WEB_ASSETS_CHECK_CONTEXT=ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: make web-bench
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: git diff --exit-code -- src/runtime/operator/proto web/operator/src/generated

  ray:
    name: Ray tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -m ray

  tmux:
    name: Tmux TUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -m tmux
