name: Release operator UI

on:
  push:
    tags:
      - "operator-ui-v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate operator UI tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify tag is on main
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == *"-"* ]]; then
            echo "::notice title=Ancestry check skipped::Prerelease tag '$TAG', skipping main ancestry check."
            exit 0
          fi

          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag '$TAG' is a valid commit on main"
          else
            echo "::error::Tag '$TAG' is not on the main branch."
            exit 1
          fi
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#operator-ui-v}"
          PACKAGE_VERSION="$(node -p "require('./web/operator/package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $TAG does not match web/operator/package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "Tag $TAG matches @trampoline-ai/operator-ui@$PACKAGE_VERSION"

  build:
    name: Build operator UI package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Install browser dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generate operator client
        run: make web-proto
      - name: Verify generated operator client
        run: git diff --exit-code -- src/runtime/operator/proto web/operator/src/generated
      - name: Test operator UI
        run: pnpm --filter @trampoline-ai/operator-ui run test
        working-directory: web
      - name: Lint operator UI
        run: pnpm --filter @trampoline-ai/operator-ui run lint
        working-directory: web
      - name: Verify packaged browser assets
        run: make web-assets-check WEB_ASSETS_CHECK_CONTEXT=ci
      - name: Pack operator UI
        run: |
          mkdir -p "$RUNNER_TEMP/operator-ui"
          pnpm pack --pack-destination "$RUNNER_TEMP/operator-ui"
        working-directory: web/operator
      - name: Verify package archive
        env:
          PACKAGE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${PACKAGE_TAG#operator-ui-v}"
          export VERSION
          ARCHIVE="$RUNNER_TEMP/operator-ui/trampoline-ai-operator-ui-$VERSION.tgz"
          PACKAGE_ROOT="$RUNNER_TEMP/operator-ui-unpacked/package"
          export PACKAGE_ROOT
          test -f "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/operator-ui-unpacked"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/operator-ui-unpacked"
          test -f "$PACKAGE_ROOT/dist/index.js"
          test -f "$PACKAGE_ROOT/dist/index.d.ts"
          test -f "$PACKAGE_ROOT/dist/styles.css"
          test -f "$PACKAGE_ROOT/dist/ui/OperatorUi.d.ts"
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const root = process.env.PACKAGE_ROOT;
          const packageJson = JSON.parse(await readFile(`${root}/package.json`, "utf8"));
          if (packageJson.name !== "@trampoline-ai/operator-ui") {
            throw new Error(`Unexpected package name: ${packageJson.name}`);
          }
          if (packageJson.version !== process.env.VERSION) {
            throw new Error(`Unexpected package version: ${packageJson.version}`);
          }
          if (packageJson.publishConfig?.registry !== "https://npm.pkg.github.com") {
            throw new Error("Package archive is not configured for GitHub Packages.");
          }
          if (packageJson.exports?.["./styles.css"] !== "./dist/styles.css") {
            throw new Error("Package archive does not export its styles.");
          }
          if (packageJson.repository?.url !== "https://github.com/Trampoline-AI/avalanche.git") {
            throw new Error("Package archive is not linked to this repository.");
          }
          const declarations = await readFile(`${root}/dist/index.d.ts`, "utf8");
          for (const symbol of ["OperatorUi", "OperatorUiHost", "WorkflowWorkspace"]) {
            if (!declarations.includes(symbol)) {
              throw new Error(`Missing public export: ${symbol}`);
            }
          }
          EOF
      - name: Upload package archive
        uses: actions/upload-artifact@v4
        with:
          name: operator-ui-package
          path: ${{ runner.temp }}/operator-ui/*.tgz
          if-no-files-found: error

  publish:
    name: Publish operator UI to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@trampoline-ai"
      - name: Download package archive
        uses: actions/download-artifact@v4
        with:
          name: operator-ui-package
          path: ${{ runner.temp }}/operator-ui
      - name: Publish package archive
        run: npm publish "$RUNNER_TEMP"/operator-ui/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

