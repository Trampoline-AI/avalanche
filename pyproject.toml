[project]
name = "avalanche-ai"
version = "0.1.0rc0"
description = "Python toolkit for local data-flow experiments with Iceberg and Lance"
authors = [{ name = "Gabriel Lesperance", email = "611342+glesperance@users.noreply.github.com" }]
requires-python = "<3.14,>=3.11"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyiceberg[glue, pandas, pyarrow, s3fs, sql-sqlite]>=0.9,<0.11",
    "dataframely>=1.13.0",
    "pydantic>=2,<3",
    "python-ulid>=3.0.0",
]

[project.scripts]
ava = "ava_cli:main"

[project.optional-dependencies]
runtime = [
    "grpcio>=1.75.1",
    "grpcio-tools>=1.75.1",
    "watchfiles>=1.1.1",
    "croniter>=6.2.2",
]
tui = [
    "textual>=6.2.1",
    "grpcio>=1.75.1",
]
ray = [
    "ray[default]>=2.50.0",
]
lance = [
    "pylance>=0.24.0",
]
s3 = [
    "s3fs>=2023.12.2",
]
all = [
    "croniter>=6.2.2",
    "grpcio>=1.75.1",
    "grpcio-tools>=1.75.1",
    "pylance>=0.24.0",
    "ray[default]>=2.50.0",
    "s3fs>=2023.12.2",
    "textual>=6.2.1",
    "watchfiles>=1.1.1",
]

[dependency-groups]
dev = [
    "boto3>=1.35,<1.36",
    "pytest>=8.3.1,<9",
    "pytest-testdox>=3.1.0,<4",
    "pytest-asyncio>=0.23.8,<0.24",
    "ruff>=0.5.6,<0.6",
    "croniter>=6.2.2",
    "flask>=3,<4",
    "grpcio>=1.75.1",
    "grpcio-tools>=1.75.1",
    "moto[s3,server]>=5,<6",
    "pylance>=0.24.0",
    "ray[default]>=2.50.0",
    "s3fs>=2023.12.2,<2024",
    "pytest-cov>=7.0.0",
    "textual>=6.2.1",
    "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rP --testdox"
asyncio_mode = "strict"
markers = [
    "tmux: tests that require a tmux session (real terminal rendering)",
    "ray: tests that require a local Ray runtime",
]

[tool.ruff]
lint.select = ["E", "F", "W", "I", "N"]
line-length = 96

[tool.ruff.lint.isort]
known-first-party = ["avalanche", "ava_cli", "runtime", "tui"]

[tool.ruff.lint.per-file-ignores]
# Generated by protoc; preserve generated import layout and gRPC method names.
"src/runtime/operator/proto/operator_pb2*.py" = ["E501", "F401", "F541", "I001", "N802"]
"src/runtime/operator/proto/operator_pb2*.pyi" = ["E501", "I001"]

[tool.coverage.run]
source = ["src/avalanche"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.hatch.build.targets.sdist]
include = ["src/avalanche", "src/ava_cli", "src/runtime", "src/tui"]

[tool.hatch.build.targets.wheel]
include = ["src/avalanche", "src/ava_cli", "src/runtime", "src/tui"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
